<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelorus</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #0a0a0f;
      --surface:    #12121a;
      --border:     #1e1e2e;
      --text:       #c8c8d4;
      --text-dim:   #5a5a6e;
      --accent:     #4a9eff;
      --ok:         #2ecc71;
      --err:        #e74c3c;
      --warn:       #f39c12;
      --font-mono:  'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* --- Header --- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
      background: var(--bg);
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    #status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    #status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--err);
      transition: background 0.3s;
    }

    #status.connected .dot {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }

    .spacer { flex: 1; }

    #theme-btn {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: var(--font-mono);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    #theme-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* --- Stats bars --- */
    #stats, #perf {
      display: flex;
      gap: 16px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--text-dim);
      flex-wrap: wrap;
      background: var(--bg);
      z-index: 10;
    }

    #stats { border-bottom: 1px solid var(--border); }
    #perf { border-bottom: 1px solid var(--border); }

    .stat b {
      color: var(--text);
      font-weight: 500;
    }

    /* --- Map container --- */
    #map-container {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #map-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* --- Time slider --- */
    #time-slider {
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 6px 12px;
      z-index: 10;
    }

    .ts-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ts-row-secondary {
      margin-top: 4px;
      padding-left: 2px;
    }

    .ts-mode {
      background: var(--ok);
      color: var(--bg);
      border: none;
      border-radius: 3px;
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      min-width: 52px;
      text-align: center;
      transition: background 0.2s;
    }

    .ts-mode.scrub {
      background: var(--warn);
    }

    .ts-slider, .ts-window {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .ts-slider::-webkit-slider-thumb, .ts-window::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg);
      transition: transform 0.1s;
    }

    .ts-slider::-webkit-slider-thumb:hover, .ts-window::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .ts-slider::-moz-range-thumb, .ts-window::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg);
    }

    .ts-label, .ts-window-label, .ts-window-value {
      font-size: 11px;
      color: var(--text-dim);
      min-width: 60px;
      white-space: nowrap;
    }

    .ts-window-label { min-width: 52px; }
    .ts-window-value { min-width: 40px; }

    .ts-window {
      max-width: 200px;
    }

    /* --- Log --- */
    #log {
      height: 100px;
      min-height: 50px;
      overflow-y: auto;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-dim);
      transition: background 0.2s;
      z-index: 10;
    }

    #log .entry { white-space: pre; }
    #log .entry.sent { color: var(--accent); }
    #log .entry.recv { color: var(--ok); }
    #log .entry.sys  { color: var(--text-dim); }
    #log .entry.err  { color: var(--err); }
    #log .entry.data { color: var(--warn); }

    #log::-webkit-scrollbar { width: 6px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    #log::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Pelorus</h1>
      <div id="status">
        <span class="dot"></span>
        <span class="label">disconnected</span>
      </div>
      <div class="spacer"></div>
      <button id="theme-btn" title="toggle theme">◐</button>
    </header>

    <div id="stats"></div>
    <div id="perf"></div>

    <div id="map-container"></div>

    <div id="time-slider"></div>

    <div id="log"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
