<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 1 — WebSocket Scaffold</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --text: #c8c8d4;
      --text-dim: #5a5a6e;
      --accent: #4a9eff;
      --ok: #2ecc71;
      --err: #e74c3c;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    #status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    #status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--err);
      transition: background 0.3s;
    }

    #status.connected .dot { background: var(--ok); }

    #map-container {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
    }

    #msg-input:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    button:hover { opacity: 0.85; }

    #log {
      height: 160px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-dim);
    }

    #log .entry { white-space: pre; }
    #log .entry.sent { color: var(--accent); }
    #log .entry.recv { color: var(--ok); }
    #log .entry.sys  { color: var(--text-dim); }
    #log .entry.err  { color: var(--err); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Phase 1 — WebSocket</h1>
      <div id="status">
        <span class="dot"></span>
        <span class="label">disconnected</span>
      </div>
    </header>

    <div id="map-container">
      map canvas — phase 3
    </div>

    <div id="controls">
      <input id="msg-input" type="text" placeholder="type a message and press enter" />
      <button id="send-btn">SEND</button>
    </div>

    <div id="log"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
